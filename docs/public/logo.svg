<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="facetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="rubyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#e11d48" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Gem Shape with Gradient & Shadow -->
  <polygon points="6,3 18,3 22,9 12,22 2,9" fill="url(#rubyGrad)" filter="url(#rubyGlow)" stroke="#be123c" stroke-width="0.5" stroke-linejoin="round" />

  <!-- Upper table facet highlight -->
  <polygon points="6,3 18,3 15,9 9,9" fill="url(#facetGrad)" />

  <!-- Left top facet -->
  <polygon points="2,9 6,3 9,9" fill="#ffffff" fill-opacity="0.15" />

  <!-- Right top facet -->
  <polygon points="18,3 22,9 15,9" fill="#000000" fill-opacity="0.12" />

  <!-- Center bottom facet -->
  <polygon points="9,9 15,9 12,22" fill="#ffffff" fill-opacity="0.1" />

  <!-- Left bottom facet -->
  <polygon points="2,9 9,9 12,22" fill="#ffffff" fill-opacity="0.2" />

  <!-- Right bottom facet -->
  <polygon points="22,9 15,9 12,22" fill="#000000" fill-opacity="0.2" />

  <!-- Lucide Gem Outline & Inner Facet Lines -->
  <path d="M6 3h12l4 6-10 13L2 9Z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <path d="M11 3 8 9l4 13 4-13-3-6" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
  <path d="M2 9h20" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
</svg>
